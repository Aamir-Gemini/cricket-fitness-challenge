<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>15-Day Cricket Fitness Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            // aapka firebase config yahan dalein
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Visitor counter setup
        const visitorDoc = doc(db, "siteData", "visitorCount");
        async function incrementVisitorCount(){
            const docSnap = await getDoc(visitorDoc);
            if(docSnap.exists()){
                await updateDoc(visitorDoc, { count: increment(1) });
            } else {
                await setDoc(visitorDoc, { count: 1 });
            }
        }

        // Simple login with Name and Mobile number (login is easy)
        async function simpleLogin(name, mobile) {
            if(!name || !mobile){
                alert("Please enter both name and mobile number");
                return;
            }
            const userDoc = doc(db, "users", mobile);
            const userSnap = await getDoc(userDoc);
            if(!userSnap.exists()){
                // Naya profile create karna with bmiUpdated = false
                await setDoc(userDoc, {
                    name: name,
                    mobile: mobile,
                    bmi: null,
                    bmiUpdated: false
                });
            }
            return mobile; // mobile as user id
        }

        // Get user profile data and check BMI update status
        async function getUserProfile(mobile){
            const userDoc = doc(db, "users", mobile);
            const userSnapshot = await getDoc(userDoc);
            if(userSnapshot.exists()){
                return userSnapshot.data();
            }
            return null;
        }

        // Update BMI only once
        async function updateBMI(mobile, bmiValue) {
            const userDoc = doc(db, "users", mobile);
            const userSnapshot = await getDoc(userDoc);
            if(userSnapshot.exists()){
                const data = userSnapshot.data();
                if(data.bmiUpdated){
                    alert("BMI already updated, cannot change again");
                    return false;
                } else {
                    await updateDoc(userDoc, { bmi: bmiValue, bmiUpdated: true });
                    alert("BMI updated successfully");
                    return true;
                }
            }
            alert("User not found");
            return false;
        }

        // Page load actions
        window.onload = async function(){
            await incrementVisitorCount();
            const visitorSnap = await getDoc(visitorDoc);
            if(visitorSnap.exists()){
                document.getElementById('visitorCount').innerText = visitorSnap.data().count;
            }

            // Show login form and listen for login
            document.getElementById('loginForm').onsubmit = async function(e){
                e.preventDefault();
                const name = document.getElementById('nameInput').value.trim();
                const mobile = document.getElementById('mobileInput').value.trim();
                const userId = await simpleLogin(name, mobile);
                if(userId){
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('userProfileSection').style.display = 'block';
                    loadUserProfile(userId);
                }
            };

            // BMI update form submission
            document.getElementById('bmiForm').onsubmit = async function(e){
                e.preventDefault();
                const bmiValue = parseFloat(document.getElementById('bmiInput').value);
                if(isNaN(bmiValue) || bmiValue <= 0){
                    alert("Please enter valid BMI value");
                    return;
                }
                const mobile = document.getElementById('mobileInput').value.trim();
                await updateBMI(mobile, bmiValue);
                loadUserProfile(mobile);
            };
        };

        // Load profile and toggle BMI update form or show status
        async function loadUserProfile(mobile){
            const profile = await getUserProfile(mobile);
            if(profile){
                document.getElementById('userName').innerText = profile.name;
                document.getElementById('userMobile').innerText = profile.mobile;
                document.getElementById('userBMI').innerText = profile.bmi ? profile.bmi : 'Not updated yet';
                if(profile.bmiUpdated){
                    document.getElementById('bmiUpdateSection').style.display = 'none';
                    document.getElementById('bmiInfo').style.display = 'block';
                } else {
                    document.getElementById('bmiUpdateSection').style.display = 'block';
                    document.getElementById('bmiInfo').style.display = 'none';
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 p-6">

    <!-- Visitor counter ticker -->
    <div class="mb-4 p-2 bg-white rounded shadow text-center">
        Website Visitors: <span id="visitorCount">Loading...</span>
    </div>

    <!-- Login Section -->
    <div id="loginSection" class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-lg font-semibold mb-4">Login karo apna naam aur mobile daal kar</h2>
        <form id="loginForm">
            <input id="nameInput" type="text" placeholder="Naam" required class="w-full p-2 mb-3 border rounded" />
            <input id="mobileInput" type="tel" placeholder="Mobile Number" required class="w-full p-2 mb-3 border rounded" />
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
        </form>
    </div>

    <!-- User Profile Section -->
    <div id="userProfileSection" class="max-w-md mx-auto bg-white p-6 rounded shadow hidden">
        <h3 class="text-xl font-semibold mb-3">Welcome, <span id="userName"></span></h3>
        <p>Mobile: <span id="userMobile"></span></p>
        <p>BMI: <span id="userBMI"></span></p>

        <!-- BMI update -->
        <div id="bmiUpdateSection" class="mt-4">
            <h4 class="mb-2">Apna BMI pehli martaba update karo</h4>
            <form id="bmiForm">
                <input id="bmiInput" type="number" step="0.01" placeholder="Your BMI" required class="w-full p-2 mb-3 border rounded" />
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Update BMI</button>
            </form>
        </div>

        <div id="bmiInfo" class="mt-4 hidden p-2 bg-green-100 text-green-700 rounded">
            Aap ne apna BMI update kar diya hai. Aap dobara update nahi kar sakte.
        </div>
    </div>

</body>
</html>
